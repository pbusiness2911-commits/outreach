# Render Blueprint: one always-on web service (API + sending worker) and a Postgres database.
services:
  - type: web
    name: outreach
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: outreach-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MILLIONVERIFIER_API_KEY
        sync: false

databases:
  - name: outreach-db
    plan: basic-256mb
    databaseName: outreach
