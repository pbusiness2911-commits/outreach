# Render Blueprint (free plan). The database lives on Neon (free Postgres); paste its URL as DATABASE_URL.
# Free services sleep after 15 minutes without traffic, so an UptimeRobot monitor pings /healthz every 5 minutes.
# To upgrade later: change plan to starter (no other changes needed).
services:
  - type: web
    name: outreach
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MILLIONVERIFIER_API_KEY
        sync: false
